apiVersion: 1

providers:
  - name: "Dive Realities Dashboards"
    orgId: 1
    type: file
    disableDeletion: true    # impede remoção via UI — dashboards são gerenciados pelo repositório
    updateIntervalSeconds: 30
    allowUiUpdates: false    # alterações via UI são descartadas no próximo reload
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
