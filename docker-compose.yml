name: dive-observability

networks:
  dive-observability:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  promtail_positions:
    # persists Promtail read offsets — prevents log re-ingestion on container restart
  configs_rendered:
    # populated by config-renderer at each `make up`; consumed by Prometheus + Alertmanager
  caddy_data:
    # Let's Encrypt certs — losing this volume triggers a new ACME challenge (rate-limited)
  caddy_config:

services:

  # ── Config Renderer ────────────────────────────────────────────────────────
  # One-shot Alpine container that substitutes ${VAR} in configs before any
  # monitoring service starts. Runs on every `make up` via Makefile ordering.
  # Docker-native alternative to render-configs.sh: env vars come from .env,
  # envsubst writes to a named volume consumed by Prometheus + Alertmanager.
  config-renderer:
    image: alpine:3.21
    container_name: dive-config-renderer
    restart: "no"
    env_file: .env
    command: >
      sh -c "
        apk add -q --no-cache gettext &&
        envsubst < /src/prometheus.yml > /rendered/prometheus.yml &&
        envsubst < /src/alertmanager.yml > /rendered/alertmanager.yml &&
        echo '[ OK ] prometheus.yml rendered' &&
        echo '[ OK ] alertmanager.yml rendered'
      "
    volumes:
      - ./prometheus/prometheus.yml:/src/prometheus.yml:ro
      - ./alertmanager/alertmanager.yml:/src/alertmanager.yml:ro
      - configs_rendered:/rendered
    networks:
      - dive-observability

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: dive-prometheus
    restart: unless-stopped
    volumes:
      - configs_rendered:/rendered:ro           # rendered prometheus.yml from config-renderer
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/rendered/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"  # enables config reload via POST /-/reload
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.75'
    # no external port — only accessed internally by Grafana
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "prometheus"
      com.diverealities.team: "infra"

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dive-alertmanager
    restart: unless-stopped
    volumes:
      - configs_rendered:/rendered:ro           # rendered alertmanager.yml from config-renderer
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/rendered/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "alertmanager"
      com.diverealities.team: "infra"

  # ── Node Exporter ──────────────────────────────────────────────────────────
  # Exposes host-level metrics of the observability VPS itself.
  # Runs on host network to access real proc/sys metrics (not container metrics).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dive-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.10'
    labels:
      com.diverealities.service: "node-exporter"
      com.diverealities.team: "infra"

  # ── cAdvisor ──────────────────────────────────────────────────────────────
  # Container-level metrics for all Docker containers on the observability VPS.
  # privileged: true — required to access cgroup and perf_event subsystems
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dive-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "cadvisor"
      com.diverealities.team: "infra"

  # ── Loki ──────────────────────────────────────────────────────────────────
  # Log aggregation backend. Port 3100 exposed to host; UFW restricts to
  # Tailscale subnet (100.64.0.0/10) only — not reachable from public internet.
  loki:
    image: grafana/loki:3.2.1
    container_name: dive-loki
    restart: unless-stopped
    env_file: .env
    ports:
      - "3100:3100"  # Tailscale-only — UFW: allow from 100.64.0.0/10 to any port 3100
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-config.expand-env=true"   # native env var expansion — no render step needed
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.50'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "loki"
      com.diverealities.team: "infra"

  # ── Promtail ───────────────────────────────────────────────────────────────
  # Log shipping agent for the observability VPS itself.
  # App VPS logs are shipped by Promtail systemd services installed via install-agents.sh.
  promtail:
    image: grafana/promtail:3.2.1
    container_name: dive-promtail
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ${PM2_LOGS_PATH:-/root/.pm2/logs}:/pm2-logs:ro
      - promtail_positions:/var/lib/promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
      - "-config.expand-env=true"
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "promtail"
      com.diverealities.team: "infra"

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Dashboard unificado de métricas e logs.
  # Acesso externo via Caddy (HTTPS) — sem porta direta no host.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: dive-grafana
    restart: unless-stopped
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.diverealities.com.br}
      - GF_ANALYTICS_REPORTING_ENABLED=false  # disable phone-home telemetry to Grafana Labs
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # no host port — Caddy handles TLS termination and proxies to :3000 on the internal network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "grafana"
      com.diverealities.team: "infra"

  # ── Caddy ──────────────────────────────────────────────────────────────────
  # Reverse proxy com TLS automático via Let's Encrypt.
  # Substitui Nginx + Certbot no host — zero configuração manual de certificados.
  caddy:
    image: caddy:2.9-alpine
    container_name: dive-caddy
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP-01 ACME challenge redirect
      - "443:443"  # HTTPS — Grafana public access
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certs — must persist to avoid Let's Encrypt rate limits
      - caddy_config:/config
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN:-grafana.diverealities.com.br}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      grafana:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.15'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "caddy"
      com.diverealities.team: "infra"

  # ── Discord Bridges ────────────────────────────────────────────────────────
  # One container per Discord channel — translates Alertmanager webhook payload
  # to Discord embed format. Separate containers allow per-channel silencing.

  alertmanager-discord-prod-critical:
    image: benjojo/alertmanager-discord:latest
    container_name: dive-discord-prod-critical
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_PROD_CRITICAL}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9094/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.10'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "discord-bridge"
      com.diverealities.env: "prod"

  alertmanager-discord-prod-warning:
    image: benjojo/alertmanager-discord:latest
    container_name: dive-discord-prod-warning
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_PROD_WARNING}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9094/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.10'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "discord-bridge"
      com.diverealities.env: "prod"

  # alertmanager-discord-staging removido — stack opera apenas com dev e prod
  alertmanager-discord-dev:
    image: benjojo/alertmanager-discord:latest
    container_name: dive-discord-dev
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_DEV}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9094/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.10'
    networks:
      - dive-observability
    labels:
      com.diverealities.service: "discord-bridge"
      com.diverealities.env: "dev"
