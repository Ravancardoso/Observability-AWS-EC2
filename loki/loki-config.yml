auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 0  # gRPC desabilitado — não há clustering nem componentes remotos

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # LOKI_RETENTION vem do .env — expandido nativamente via -config.expand-env=true
  # 720h = 30 dias; ajuste conforme disco disponível na VPS de observabilidade
  retention_period: ${LOKI_RETENTION:-720h}
  ingestion_rate_mb: 16          # 16 MB/s: suficiente para 2 VPSes com logs moderados
  ingestion_burst_size_mb: 32    # burst permite picos sem rejeição imediata
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # rejeita logs com mais de 7 dias de atraso na entrega

compactor:
  working_directory: /loki/compactor
  retention_enabled: true         # habilita limpeza automática após retention_period
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager:9093
